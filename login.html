<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in Student restaurant lookup</title>
    <meta name="description" content="Log in to Student restaurant lookup." />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/login.js"></script>
    <link rel="icon" href="images/cool_pancake_tp.png" />
  </head>

  <body>
    <div class="container">
      <header>
        <a href="index.html" class="logo">
          <img src="images/cool_pancake_tp.png" alt="pancake logo" />
          <h1>Student restaurant lookup</h1>
        </a>
      </header>

      <main class="auth-page">
        <h2>Log in</h2>
        <form id="login-form">
          <label for="username">Username</label>
          <input id="username" type="text" />
          <label for="password">Password</label>
          <input id="password" type="password" />
          <button type="submit">Sign in</button>
          <p id="message"></p>
          <p>Dont have an account? <a href="register.html">Register</a></p>
        </form>
      </main>
    </div>
  </body>
</html>
