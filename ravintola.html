<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ravintola</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo">
          <img src="images/cool_pancake_tp.png" />
          <h1>Restaraunt lookup</h1>
        </div>
      </header>

      <section class="restaurant-info">
        <h2 id="restaurant-name">restaurant name</h2>
        <p id="restaurant-address">restaurant address</p>
        <p id="available-hours">open hours</p>
      </section>

      <section class="menu-controls">
        <label for="restaurant-select">Restaurant selection</label>
        <select id="restaurant-select">
          <option value="restaurant1">Myyrmäki</option>
          <option value="restaurant2">Myllypuro</option>
          <option value="restaurant3">Karamalmi</option>
          <option value="restaurant4">Arabia</option>
        </select>

        <div class="menu-toggle">
          <button type="button" class="active">Today</button>
          <button type="button">This week</button>
        </div>
      </section>

      <section class="products">
        <div class="product-card">
          <img src="" alt="food1" />
          <h2>Food1</h2>
          <p class="price">G, VEG</p>
        </div>
        <div class="product-card">
          <img src="" alt="food2" />
          <h2>Food2</h2>
          <p class="price">L</p>
        </div>
        <div class="product-card">
          <img src="" alt="food3" />
          <h2>Food3</h2>
          <p class="price">M</p>
        </div>
        <div class="product-card">
          <img src="" alt="food4" />
          <h2>Food4</h2>
          <p class="price">G</p>
        </div>
      </section>
    </div>
  </body>
</html>
